[pytest]
# A bare `pytest` from the repo root used to hang instead of running. The dmg
# steps in BUILDING.md put a symlink to /Applications inside staging/, and
# collection followed it and walked every application installed on the machine.
# BUILDING.md tells you to run `python -m pytest -q` when a build misbehaves,
# which is exactly when staging/ exists, so the troubleshooting step was the
# one most likely to hang.
#
# testpaths fixes the bare invocation; norecursedirs also covers an explicit
# `pytest .`. Setting norecursedirs replaces pytest's defaults rather than
# extending them, so the stock entries are repeated here with staging added.
testpaths = tests
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} staging
