name: Build

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64)
            artifact: KmzPoints-windows-x64
          - os: macos-latest
            label: macOS (Apple Silicon)
            artifact: KmzPoints-macos-arm64
          - os: macos-13
            label: macOS (Intel)
            artifact: KmzPoints-macos-x86_64
          - os: ubuntu-latest
            label: Linux (x64)
            artifact: KmzPoints-linux-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # The Linux runner has no display; the Windows and macOS runners can
      # create Tk windows directly, so the GUI tests run there unwrapped.
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
          xvfb-run -a python -m pytest -q

      - name: Run tests
        if: runner.os != 'Linux'
        run: python -m pytest -q

      - name: Build
        run: pyinstaller build.spec --noconfirm

      # Proves the bundle actually loads tkdnd and libmgrs at runtime.
      # Building successfully does not prove either of those.
      - name: Self test the frozen build (Windows)
        if: runner.os == 'Windows'
        run: .\dist\KmzPoints.exe --selftest

      - name: Self test the frozen build (macOS)
        if: runner.os == 'macOS'
        run: ./dist/KmzPoints.app/Contents/MacOS/KmzPoints --selftest

      - name: Self test the frozen build (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./dist/KmzPoints --selftest

      - name: Package .dmg
        if: runner.os == 'macOS'
        run: |
          mkdir -p staging
          cp -R dist/KmzPoints.app staging/
          ln -s /Applications staging/Applications
          hdiutil create \
            -volname "KML KMZ Point Extractor" \
            -srcfolder staging \
            -ov -format UDZO \
            "${{ matrix.artifact }}.dmg"

      - name: Stage Windows executable
        if: runner.os == 'Windows'
        run: Copy-Item dist\KmzPoints.exe "${{ matrix.artifact }}.exe"

      - name: Stage Linux binary
        if: runner.os == 'Linux'
        run: cp dist/KmzPoints "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.dmg
            ${{ matrix.artifact }}.exe
            ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
