name: Build

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # The browser version is a second implementation of the same logic, so what
  # is checked is not that it runs but that it AGREES with the Python one.
  # Expected values are regenerated from Python on every run rather than read
  # from a committed file, so a drift between the two fails here instead of
  # going unnoticed until someone compares two workbooks by hand.
  web:
    name: Browser version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate the expected values from the Python implementation
        run: python web/test/generate-fixtures.py

      - name: Check the browser version agrees with Python
        run: node --test "web/test/*.test.mjs"

      - name: Check the single-file build is current
        # Covered by the suite above, but called out separately so a stale
        # kmz-extractor.html is obvious in the job list rather than buried.
        run: |
          node web/build.mjs
          git diff --exit-code web/kmz-extractor.html \
            || (echo "::error::kmz-extractor.html is out of date. Run 'node web/build.mjs' and commit it." && exit 1)

  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64)
            artifact: KmzPoints-windows-x64
          - os: macos-latest
            label: macOS (Apple Silicon)
            artifact: KmzPoints-macos-arm64
          # No Intel mac build. Intel machines cannot run the arm64 dmg, so
          # this drops them as a supported target rather than merely trimming
          # a job -- a deliberate call, made after v1.0.0, which does ship an
          # Intel dmg. Anyone on an Intel mac can still build their own with
          # the steps in BUILDING.md, or use the LAN service or the browser
          # version, neither of which cares about the processor.
          - os: ubuntu-latest
            label: Linux (x64)
            artifact: KmzPoints-linux-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # The Linux runner has no display; the Windows and macOS runners can
      # create Tk windows directly, so the GUI tests run there unwrapped.
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
          xvfb-run -a python -m pytest -q

      - name: Run tests
        if: runner.os != 'Linux'
        shell: bash
        run: |
          python -m pytest -q 2>&1 | tee pytest-output.txt
          exit ${PIPESTATUS[0]}

      # Downloading a job log needs repository admin rights, but annotations are
      # readable by anyone. Republishing the tail of pytest's output as an
      # annotation makes a failure here diagnosable without that access.
      - name: Surface the pytest failure
        if: failure() && runner.os != 'Linux'
        shell: bash
        run: |
          python - <<'PY'
          import pathlib

          report = pathlib.Path("pytest-output.txt")
          if not report.exists():
              print("::error title=pytest::no output was captured")
              raise SystemExit

          # Annotations cap out well under pytest's full chatter, and the
          # summary that names the failures is at the end.
          tail = report.read_text(errors="replace")[-4000:]
          escaped = tail.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error title=pytest failure::{escaped}")
          PY

      - name: Build
        run: pyinstaller build.spec --noconfirm

      # Proves the bundle actually loads tkdnd and libmgrs at runtime.
      # Building successfully does not prove either of those.
      - name: Self test the frozen build (Windows)
        if: runner.os == 'Windows'
        run: .\dist\KmzPoints.exe --selftest

      - name: Self test the frozen build (macOS)
        if: runner.os == 'macOS'
        run: ./dist/KmzPoints.app/Contents/MacOS/KmzPoints --selftest

      - name: Self test the frozen build (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./dist/KmzPoints --selftest

      - name: Package .dmg
        if: runner.os == 'macOS'
        run: |
          mkdir -p staging
          cp -R dist/KmzPoints.app staging/
          ln -s /Applications staging/Applications
          hdiutil create \
            -volname "KML KMZ Point Extractor" \
            -srcfolder staging \
            -ov -format UDZO \
            "${{ matrix.artifact }}.dmg"

      - name: Stage Windows executable
        if: runner.os == 'Windows'
        run: Copy-Item dist\KmzPoints.exe "${{ matrix.artifact }}.exe"

      - name: Stage Linux binary
        if: runner.os == 'Linux'
        run: cp dist/KmzPoints "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.dmg
            ${{ matrix.artifact }}.exe
            ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
